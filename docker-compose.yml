
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guara-api
    working_dir: /app
    command: python -m app.main
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      # UPLOAD_FOLDER (app/blueprints/config/base.py e app/__init__.py) é
      # /var/www/imagens - esse volume precisa apontar pro MESMO caminho
      # usado ali, senão todo upload vira efêmero e some no próximo
      # `docker compose up -d` (todo deploy recria o container).
      - ./uploads:/var/www/imagens
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      PYTHONUNBUFFERED: "1"
      # FUSEKI_BASE_URL não é fixado aqui de propósito: o endereço certo
      # depende de onde o Fuseki de cada dev está rodando. Defina no seu
      # docker-compose.override.yml local (não versionado) ou no .env.
    restart: unless-stopped

  



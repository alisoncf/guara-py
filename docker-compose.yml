
version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guara-api
    working_dir: /app
    command: python -m app.main
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      FLASK_ENV: development
      PYTHONUNBUFFERED: "1"
      FUSEKI_BASE_URL: https://guara.ueg.br/fuseki
    depends_on:
      - fuseki
    restart: unless-stopped

  



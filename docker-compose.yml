version: "3.9"

services:
  guara:
    build: .
    image: localhost/guara:latest
    pull_policy: never
    container_name: guara
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./uploads:/uploads
    depends_on:
      - fuseki
    env_file:
      - .env

  fuseki:
    image: stain/jena-fuseki
    ports:
      - "3030:3030"
    volumes:
      - ./fuseki:/fuseki:Z,U
